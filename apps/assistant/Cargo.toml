[package]
name = "amane-assistant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Spotlight's assistant: system commands, typed or spoken, read on this machine with Cactus (Needle 3, Whistle)."
license.workspace = true
repository.workspace = true
authors.workspace = true

# The library is what the shell uses (the commands, the tools, the rules, the
# protocol); the daemon links Cactus and listens to the microphone. The shell
# takes the library alone: `default-features = false`.
[lib]
name = "amane_assistant"
path = "src/lib.rs"

[[bin]]
name = "amane-assistant"
path = "src/main.rs"
required-features = ["daemon"]

[features]
default = ["daemon"]
daemon = ["dep:libpulse-binding", "dep:libpulse-simple-binding"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
libpulse-binding = { workspace = true, optional = true }
libpulse-simple-binding = { workspace = true, optional = true }

[lints]
workspace = true
