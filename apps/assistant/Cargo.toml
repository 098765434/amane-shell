[package]
name = "amane-assistant-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The launcher's assistant: system commands, typed or spoken, read on this machine with Cactus (Needle 3, Whistle)."
license.workspace = true
repository.workspace = true
authors.workspace = true

# The daemon links Cactus (build.rs) and listens to the microphone; the
# commands, rules and protocol it shares with the shell are crates/assistant.
[[bin]]
name = "amane-assistant"
path = "src/main.rs"
# the library has the same name; its docs are the ones to build
doc = false

[dependencies]
log = { workspace = true }
amane-log = { workspace = true }
amane-assistant = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libpulse-binding = { workspace = true }
libpulse-simple-binding = { workspace = true }

[lints]
workspace = true
