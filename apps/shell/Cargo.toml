[package]
name = "emaki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Wayland desktop shell for the niri compositor: a status bar, dock, launcher, Quick Settings and glass, built on the amane shell library."
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["wayland", "niri", "bar", "status-bar", "desktop"]
categories = ["gui"]

[[bin]]
name = "emaki"
path = 'src/main.rs'

[lints]
workspace = true

[dependencies]
log = { workspace = true }
emaki-log = { workspace = true }
# pinned in [workspace.dependencies], shared with the kit
amane = { workspace = true }
emaki-phone = { workspace = true }
emaki-extension = { workspace = true }
emaki-kit = { workspace = true }
# the assistant's commands, rules and protocol; its daemon (Cactus) is apps/assistant
emaki-assistant = { workspace = true }
emaki-nixos = { workspace = true }
serde_json = { workspace = true }
# for the one bus call that hands back a file descriptor (logind's Inhibit),
# which amane's Bus can't carry; the same zbus amane already pulls in
zbus = { workspace = true }
chrono = { workspace = true }
# statvfs, for how full the disks are (already in the lock, through amane)
libc = { workspace = true }
qrcode = { version = "0.14", default-features = false }
# passwords: wiped from every buffer they pass through
zeroize = { workspace = true }
# rbw's pinentry: the wire format and peer checks the shell shares with it
emaki-pinentry = { workspace = true }
