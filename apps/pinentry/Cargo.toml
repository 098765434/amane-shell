[package]
name = "amane-pinentry"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "rbw's pinentry: asks for the master password in the shell's own dialog, over a private socket the shell checks."
license = "MIT"
repository = "https://github.com/098765434/amane-shell"
authors = ["ocbk"]

[lib]
name = "amane_pinentry"
path = "src/lib.rs"

[[bin]]
name = "amane-pinentry"
path = "src/main.rs"

[dependencies]
# SO_PEERCRED, SO_PEERPIDFD and pidfd_send_signal, which std doesn't have
libc = "0.2"
# the pin is wiped from every buffer it passes through
zeroize = "1.9"

[dev-dependencies]
proptest = "1.11"
