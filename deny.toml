# cargo-deny: what the dependencies may be. CI runs `cargo deny check`.

[graph]
# the targets emaki builds for: other platforms' crates (windows-*, objc2-*) don't count
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# a crate with a known vulnerability, or unmaintained, fails the check; an exception goes in
# `ignore` with the advisory's id and why it doesn't apply
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# what may be linked into an MIT program and shipped
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    # ffmpeg-next's bindings; ffmpeg itself is the system's library
    "WTFPL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# a path dependency within the workspace isn't a wildcard
allow-wildcard-paths = true

[sources]
# crates.io, and only the forks emaki maintains, by pinned revision
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/emaki-desktop/amane",
    "https://github.com/emaki-desktop/vello",
]
