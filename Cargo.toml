# The workspace: the shell (apps/shell), the programs beside it (apps/), and
# the crates they share (crates/). Each crate's manifest takes its package
# fields, shared dependencies and lints from here.

# Release: cross-crate inlining (thin LTO, one codegen unit) for less CPU per
# frame and smaller binaries. Fat LTO buys little more for a far longer link
# of each binary. Panics still unwind: amane's App catches a view's panic.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
incremental = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

# `all` is clippy's default set; the others are the few extra this codebase
# holds itself to. `unwrap_used` is allowed in tests (clippy.toml).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace]
resolver = "3"
members = [
    "apps/shell",
    "apps/settings",
    "apps/messages",
    "apps/mirror",
    "apps/shader-lab",
    "apps/assistant",
    "apps/drop",
    "apps/train-watch",
    "crates/base",
    "crates/kit",
    "crates/pinentry",
    "crates/phone",
    "crates/extension",
    "crates/status",
    "crates/log",
    "crates/process",
    "crates/nixos",
    "crates/assistant",
    "xtask",
]
# `cargo run` and `cargo build` with no -p mean the shell
default-members = ["apps/shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/emaki-desktop/emaki"
authors = ["ocbk"]

[workspace.dependencies]
emaki-base = { path = "crates/base" }
emaki-kit = { path = "crates/kit" }
emaki-pinentry = { path = "crates/pinentry" }
emaki-phone = { path = "crates/phone" }
emaki-extension = { path = "crates/extension" }
emaki-status = { path = "crates/status" }
emaki-log = { path = "crates/log" }
emaki-process = { path = "crates/process" }
emaki-nixos = { path = "crates/nixos" }
log = "0.4"
emaki-assistant = { path = "crates/assistant" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
libc = "0.2"
zeroize = "1.9"
zbus = "5.19.0"
libpulse-binding = "2"
libpulse-simple-binding = "2"
# amane is consumed as a pinned git-dependency on the maintained fork (not a
# submodule / path dep): reproducible for published builds, while a git-ignored
# `.cargo/local.toml` with `paths = ["../amane"]` overrides it with a sibling
# checkout during local co-development. See CONTRIBUTING.
amane = { git = "https://github.com/emaki-desktop/amane", rev = "473a7b94553db29174092ba0b665845f1986bca5", features = ["polkit-agent"] }

# amane's vello fork: scratch buffers sized for a shell (about 29 MB a set
# instead of 165, vello_encoding) that are let go when idle (vello). A patch
# only applies from the root manifest, so amane's own entries do nothing for
# this build; these must match them. The nix build needs the fork's hash in
# flake.nix outputHashes, once per crate. See docs/developer/memory.md.
[patch.crates-io]
vello = { git = "https://github.com/emaki-desktop/vello", rev = "ea3fb9eac96c4dea33e1537395d1622edcc7669d" }
vello_encoding = { git = "https://github.com/emaki-desktop/vello", rev = "ea3fb9eac96c4dea33e1537395d1622edcc7669d" }
