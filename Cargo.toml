[package]
name = "amane-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A macOS-flavoured Wayland desktop bar for the niri compositor, built on the amane shell library."
license = "MIT"
repository = "https://github.com/098765434/amane-shell"
authors = ["ocbk"]
readme = "README.md"
keywords = ["wayland", "niri", "bar", "taskbar", "desktop"]
categories = ["gui"]

[[bin]]
name = "amane-shell"
path = 'src/main.rs'

[dependencies]
# amane is consumed as a pinned git-dependency on the maintained fork (not a
# submodule / path dep): reproducible for published builds, while a git-ignored
# `.cargo/config.toml` with `paths = ["../amane-fork"]` overrides it with a
# sibling checkout during local co-development. See README.
amane = { git = "https://github.com/098765434/amane", rev = "dd6f110ffddbad067954f23e53447d5f5cbd5ce2" }
serde_json = "1.0"
chrono = "0.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
incremental = false

[workspace]
