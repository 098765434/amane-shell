[package]
name = "amane-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A macOS-flavoured Wayland desktop bar for the niri compositor, built on the amane shell library."
license = "MIT"
repository = "https://github.com/098765434/amane-shell"
authors = ["ocbk"]
readme = "README.md"
keywords = ["wayland", "niri", "bar", "status-bar", "desktop"]
categories = ["gui"]

[[bin]]
name = "amane-shell"
path = 'src/main.rs'

[dependencies]
# pinned in [workspace.dependencies], shared with the kit
amane = { workspace = true }
amane-kit = { path = "kit" }
serde_json = "1.0"
# for the one bus call that hands back a file descriptor (logind's Inhibit),
# which amane's Bus can't carry; the same zbus amane already pulls in
zbus = "5.19.0"
chrono = "0.4"
# statvfs, for how full the disks are (already in the lock, through amane)
libc = "0.2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
incremental = false

[workspace]
members = ["kit", "apps/settings", "apps/shader-lab"]

[workspace.dependencies]
# amane is consumed as a pinned git-dependency on the maintained fork (not a
# submodule / path dep): reproducible for published builds, while a git-ignored
# `.cargo/config.toml` with `paths = ["../amane"]` overrides it with a
# sibling checkout during local co-development. See README.
amane = { git = "https://github.com/098765434/amane", rev = "04a3efd80c54a4690966cc90a20fe08a72304acd" }

# amane's vello fork: scratch buffers sized for a shell (about 29 MB a set
# instead of 165). A patch only applies from the root manifest, so amane's own
# entry does nothing for this build; this one must match it. The nix build
# needs the fork's hash in flake.nix outputHashes. See docs/development/memory.md.
[patch.crates-io]
vello_encoding = { git = "https://github.com/098765434/vello", branch = "ocbk" }
