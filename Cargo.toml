[package]
name = "amane-shell"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "amane-shell"
path = 'src/main.rs'

[dependencies]
amane = { path = '../amane-fork' }
serde_json = "1.0"
chrono = "0.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
incremental = false

[workspace]
