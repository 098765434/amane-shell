name: CI

on:
  push:
    branches: [main]
  pull_request:

# the token reads the repository and does nothing else
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # no Nix cache past cache.nixos.org: magic-nix-cache was throttled by
      # the Actions cache and wanted a FlakeHub login, failing every run
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # cargo's registry and target dir, so amane and wgpu aren't rebuilt
      # every run
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # clippy/test compile every crate in the workspace, the apps too,
      # pulling the public `amane` git-dependency (no credentials needed).
      - name: rustfmt
        run: nix develop -c cargo fmt --all --check

      # --locked: a Cargo.lock out of step with Cargo.toml fails instead of
      # being rewritten
      - name: clippy
        run: nix develop -c cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: nix develop -c cargo test --workspace --locked

      # the dependencies: no known vulnerability or yanked crate, only allowed licences, and
      # git only from the emaki-desktop forks (deny.toml)
      - name: cargo deny
        run: nix develop -c nix run nixpkgs#cargo-deny -- check

      # rustdoc's warnings (broken links, docs naming private items) fail the build
      - name: doc
        run: nix develop -c cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- gen-layer-rules.sh scripts/check-pins scripts/idle-report scripts/lint-terms scripts/migrate-from-amane

      # no other vendor's platform terms in the text (docs/archive/ROADMAP.md, ground rules)
      - name: lint-terms
        run: scripts/lint-terms scripts/migrate-from-amane

      # every relative link in the Markdown names a file that exists
      - name: links
        run: nix develop -c cargo xtask links

      # amane and niri agree at the pinned revisions: the same protocol XMLs, and
      # every niri IPC name amane uses exists (docs/integration/contract.md)
      - name: checkout amane and niri for the contract
        run: |
          git clone --filter=blob:none -q https://github.com/emaki-desktop/amane .contract/amane
          git clone --filter=blob:none -q https://github.com/emaki-desktop/niri .contract/niri
      - name: contract
        run: nix develop -c cargo xtask contract --amane .contract/amane --niri .contract/niri

  # The parsers that read another program's bytes (fuzz/), each for a minute: a panic or a
  # broken property fails the run, and libFuzzer prints the input that did it
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: fuzz
        working-directory: fuzz
        run: |
          for target in assuan pinentry_wire percent nix_attr; do
            nix develop ..#fuzz -c cargo fuzz run -O "$target" -- -max_total_time=60 -max_len=4096
          done

  # The Nix package: catches a stale amane `outputHashes` after a rev bump
  # (flake.nix), and runs the tests again in its check phase.
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: nix build
        run: nix build -L
      # the NixOS module's activation helper builds, and refuses what isn't a system
      - name: nixos module
        run: nix build -L .#checks.x86_64-linux.nixos-activate
