[package]
name = "amane-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The controls, design tokens and theme of amane-shell, for building apps that look like the shell."
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
log = { workspace = true }
# the same pinned amane as the shell, overridden the same way during co-development
amane = { workspace = true }
serde_json = { workspace = true }
fontconfig = "0.11"

[features]
# the token tools (tokens::lint, tokens::check) for `cargo xtask tokens …`; the shell and the
# apps leave them out
tools = []

[build-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
