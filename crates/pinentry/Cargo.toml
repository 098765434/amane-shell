[package]
name = "emaki-pinentry"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "rbw's pinentry: asks for the master password in the shell's own dialog, over a private socket the shell checks."
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "emaki_pinentry"
path = "src/lib.rs"

[[bin]]
name = "emaki-pinentry"
path = "src/main.rs"

[dependencies]
emaki-base = { workspace = true }
log = { workspace = true }
emaki-log = { workspace = true }
# SO_PEERCRED, SO_PEERPIDFD and pidfd_send_signal, which std doesn't have
libc = { workspace = true }
# the pin is wiped from every buffer it passes through
zeroize = { workspace = true }

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
